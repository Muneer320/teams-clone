services:
  # Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: teams-clone-backend
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      - PORT=3001
      - CORS_ORIGIN=http://localhost:5173,http://127.0.0.1:5173
      - NODE_ENV=development
      - JWT_SECRET=${JWT_SECRET:-}
    volumes:
      - teams_data:/app/data
    networks:
      - teams-clone-network
    restart: unless-stopped

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: teams-clone-frontend
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3001
    networks:
      - teams-clone-network
    depends_on:
      - backend
    restart: unless-stopped

networks:
  teams-clone-network:
    driver: bridge

volumes:
  teams_data:
