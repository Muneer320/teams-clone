name: Verify demo
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend
      - run: npm --prefix backend test
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend run build
      - run: python -m pip install -r python_agent/requirements.txt
      - name: Start backend
        run: |
          npm --prefix backend start > backend.log 2>&1 &
          for n in {1..30}; do
            if curl --silent --fail http://127.0.0.1:3001/health; then exit 0; fi
            sleep 1
          done
          cat backend.log
          exit 1
      - run: python tests/smoke_api.py
      - run: python python_agent/check_env.py
      - run: python rl_demo/run_demo.py --task active_participant
